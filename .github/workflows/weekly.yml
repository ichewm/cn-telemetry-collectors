name: weekly

# Weekly refresh: recompute corroboration -> probe new candidates -> append to
# QUARANTINE via PR (humans do promotion) -> rebuild + publish rolling release.
on:
  schedule:
    - cron: "0 4 * * 1"   # Mon 04:00 UTC = 12:00 CST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute corroboration (updates QUARANTINE.domains)
        run: python3 tools/corroborate.py
      - name: Probe every quarantined candidate (evidence for reviewers)
        run: |
          grep -E '^[a-z0-9.-]+ *\|' QUARANTINE.domains | cut -d'|' -f1 > q.txt || true
          if [ -s q.txt ]; then python3 tools/probe.py $(cat q.txt) | tee probe-report.txt; else echo "no quarantine candidates" > probe-report.txt; fi
      - name: Rebuild + tests
        run: |
          python3 tools/test_build_lists.py
          python3 tools/build_lists.py
          python3 tools/build_noise.py   # popularity corpus for profile-fog consumers
      - name: Verify STABLE list (L1 re-probe + L2 allowlist screening)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/verify_list.py 2>&1 | tee verify-report.txt
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            gh issue create --title "VERIFY FAIL $(date -u +%F): fingerprint reversal or allowlist collision" \
              --body-file verify-report.txt || true
            exit 1
          fi
      - name: Open promotion PR (only when QUARANTINE changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "list-bot"
          git config user.email "list-bot@users.noreply.github.com"
          if git diff --quiet QUARANTINE.domains; then
            echo "no new candidates this week"
          else
            BR="quarantine/auto-$(date -u +%F)"
            git checkout -b "$BR"
            git add QUARANTINE.domains
            git commit -m "quarantine: weekly auto-discovery $(date -u +%F)"
            git push origin "$BR"
            gh pr create --title "Quarantine refresh $(date -u +%F)" --body-file probe-report.txt \
              --label "quarantine" 2>/dev/null || true
          fi
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(grep -cE '^[a-z0-9.-]+ *\|' telemetry.domains)
          notes="Weekly rebuild $(date -u +%F) — ${n} stable entries. Quarantined candidates await promotion review."
          if gh release view list >/dev/null 2>&1; then gh release edit list --notes "$notes"
          else gh release create list --title "Rolling list" --notes "$notes"; fi
          gh release upload list dist/* --clobber
      - name: Publish dist branch (raw-URL subscription path)
        run: |
          # Plumbing-only branch holding the artifacts at the BRANCH ROOT — same
          # layout as esp32-c3-adblock-cn's Gitee dist (devices/subscribers fetch
          # raw URLs like .../raw/dist/telemetry.hosts with no dist/ prefix).
          git fetch origin dist || true
          TMPIDX=$(mktemp)
          export GIT_INDEX_FILE=$TMPIDX
          git read-tree --empty
          # update-index gives full control of the recorded path (git add always
          # records root-relative paths, which nested the files under dist/)
          for f in telemetry.hosts adguard.txt telemetry.bin noise-corpus.bin; do
            B=$(git hash-object -w dist/$f)
            git update-index --add --cacheinfo 100644,$B,$f
          done
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          PARENT=$(git rev-parse --verify -q origin/dist^{commit} || true)
          if [ -n "$PARENT" ]; then NEW=$(git commit-tree "$TREE" -p "$PARENT" -m "dist $(date -u +%F)")
          else NEW=$(git commit-tree "$TREE" -m "dist $(date -u +%F)"); fi
          git push --force origin "$NEW:refs/heads/dist"
      - name: Mirror dist branch to Gitee (CN distribution)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 匿名 raw 需仓库公开过审; 审核前设备/订阅方也可用 API+token 通道。
          # token 只进 header/URL 参数——不落日志(gh 掩码 + push -q 不回显)。
          if [ -n "$GITEE_TOKEN" ]; then
            git push -q --force "https://hewmbj:${GITEE_TOKEN}@gitee.com/hewmbj/cn-telemetry-collectors.git" \
              "origin/dist:refs/heads/dist" || echo "(gitee mirror push failed — continuing)"
          else
            echo "(GITEE_TOKEN not set — skipping gitee mirror)"
          fi
